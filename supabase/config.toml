# =============================================
# CONFIGURATION SIMPLIFIÉE - SUPABASE LOCAL
# =============================================
project_id = "montoit"

# ─────────────────────────────────────────────
# API (PostgREST)
# ─────────────────────────────────────────────
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

# ─────────────────────────────────────────────
# BASE DE DONNÉES (PostgreSQL)
# ─────────────────────────────────────────────
[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

# ─────────────────────────────────────────────
# AUTHENTIFICATION (GoTrue)
# ─────────────────────────────────────────────
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

# ─────────────────────────────────────────────
# STUDIO (Interface Web)
# ─────────────────────────────────────────────
[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# ─────────────────────────────────────────────
# STORAGE (Fichiers)
# ─────────────────────────────────────────────
[storage]
enabled = true
file_size_limit = "50MiB"

# ─────────────────────────────────────────────
# REALTIME (WebSockets)
# ─────────────────────────────────────────────
[realtime]
enabled = true

# ─────────────────────────────────────────────
# SERVICES DÉSACTIVÉS (pour éviter les conflits)
# ─────────────────────────────────────────────
[analytics]
enabled = false

[inbucket]
enabled = false

[edge_runtime]
enabled = false

[db.pooler]
enabled = false

[storage.s3_protocol]
enabled = false