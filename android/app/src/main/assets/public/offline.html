<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Toit — Hors ligne</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #fafafa;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      margin-bottom: 32px;
    }
    .logo svg {
      width: 72px;
      height: 72px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 800;
      color: #1a1a2e;
      margin-top: 12px;
      letter-spacing: -0.5px;
    }
    .logo span {
      color: #FF6C2F;
    }
    .icon {
      margin: 32px auto;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #FFF0E8;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 32px; height: 32px; }
    h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #64748b;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: #FF6C2F;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #E05519; }
    .btn:active { transform: scale(0.97); }
    .btn svg { width: 18px; height: 18px; }
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M36 6L8 28v34h18V44h20v18h18V28L36 6z" fill="#FF6C2F"/>
        <path d="M36 12L14 30v28h12V40h20v18h12V30L36 12z" fill="#fff"/>
        <rect x="30" y="52" width="12" height="8" rx="1" fill="#FF6C2F"/>
      </svg>
      <h1>Mon <span>Toit</span></h1>
    </div>

    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1l22 22M9 5l3-2 10 8v11M5 7v10h14" stroke="#FF6C2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M16 21v-6a2 2 0 00-2-2h-4a2 2 0 00-2 2v6" stroke="#FF6C2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h2>Pas de connexion internet</h2>
    <p>
      Mon Toit nécessite une connexion internet pour fonctionner.<br />
      Vérifiez votre réseau et réessayez.
    </p>

    <button class="btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 3v6h-6M3 21v-6h6"/>
        <path d="M21 9a9 9 0 01-15 6.2M3 15a9 9 0 0115-6.2"/>
      </svg>
      Réessayer
    </button>

    <p class="footer">Mon Toit © 2026</p>
  </div>
</body>
</html>
